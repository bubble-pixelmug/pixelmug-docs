<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">PixelMug Studio runtime architecture</title><desc id="desc">Bubble cloud connects Studio, Bubble App, and PixelMug. Green paths show active state and services.</desc><rect width="1000" height="500" rx="28" fill="#f5f9ff"/><path d="M120 264 500 114 880 264" fill="none" stroke="#2aa968" stroke-width="5" stroke-dasharray="12 9"/><path d="M500 264V114" fill="none" stroke="#a9bdd3" stroke-width="4" stroke-dasharray="10 8"/><path d="M155 347C285 420 420 420 468 347M155 374C390 475 700 475 845 374" fill="none" stroke="#2aa968" stroke-width="5" stroke-dasharray="12 9"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="405" y="48" width="190" height="66" rx="18" fill="#fff" stroke="#b9d3f2" stroke-width="2"/><text x="500" y="76" font-size="21" font-weight="700" fill="#183b65">Bubble cloud</text><text x="500" y="98" font-size="14" fill="#58708f">service</text><rect x="45" y="264" width="210" height="83" rx="18" fill="#fff" stroke="#b9d3f2" stroke-width="2"/><text x="150" y="296" font-size="20" font-weight="700" fill="#183b65">PixelMug Studio</text><text x="150" y="321" font-size="14" fill="#16834a">Bot · WebApp</text><rect x="395" y="264" width="210" height="83" rx="18" fill="#fff" stroke="#b9d3f2" stroke-width="2"/><text x="500" y="296" font-size="20" font-weight="700" fill="#183b65">Bubble App</text><text x="500" y="321" font-size="14" fill="#58708f">phone</text><rect x="745" y="264" width="210" height="83" rx="18" fill="#fff" stroke="#b9d3f2" stroke-width="2"/><text x="850" y="296" font-size="20" font-weight="700" fill="#183b65">PixelMug</text><text x="850" y="321" font-size="14" fill="#16834a">MPY</text></g><text x="305" y="433" font-family="Arial,sans-serif" font-size="14" fill="#16834a">WebApp URL on the LAN</text><text x="590" y="474" font-family="Arial,sans-serif" font-size="14" fill="#16834a">MPY deployment and runtime</text><text x="